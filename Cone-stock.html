<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cone Stock</title>

    <link rel="stylesheet" href="Cone-stock.css">
</head>

<body>

    <!-- TOP BAR -->
    <header class="topbar">

        <button class="back-btn" id="backBtn">
            ‹
        </button>

        <div class="top-info">
            <h1 id="companyName">AYM Cone</h1>
            <p>Polyester Yarn</p>
        </div>

        <button class="add-btn" id="addBtn">
            +
        </button>

    </header>


    <!-- TOTAL WEIGHT -->
    <section class="total-section">

        <span>Total Weight</span>

        <strong id="totalWeight">
            0.000 kg
        </strong>

    </section>


    <!-- SEARCH -->
    <div class="search-box">

        <span>⌕</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search transactions..."
        >

    </div>


    <!-- TRANSACTIONS -->
    <main>

        <div id="transactionList"></div>

        <div id="emptyMessage" class="empty-message">
            No transactions yet
        </div>

    </main>


    <!-- ADD / EDIT POPUP -->
    <div class="popup-overlay" id="popupOverlay">

        <div class="popup">

            <div class="popup-header">

                <h2 id="popupTitle">
                    Add Transaction
                </h2>

                <button id="closePopup">
                    ×
                </button>

            </div>


            <!-- BUY / RETURN -->
            <div class="type-buttons">

                <button
                    class="type-btn buy-type active"
                    id="buyBtn"
                >
                    🛒 Buy
                </button>

                <button
                    class="type-btn return-type"
                    id="returnBtn"
                >
                    ↩ Return
                </button>

            </div>


            <!-- DATE -->
            <label>
                Date
            </label>

            <input
                type="date"
                id="dateInput"
            >


            <!-- BOX COUNT -->
            <label>
                Total Boxes
            </label>

            <input
                type="number"
                id="boxCount"
                min="1"
                placeholder="Enter number of boxes"
            >


            <!-- WEIGHTS -->
            <label>
                Box Weights (kg)
            </label>

            <div id="weightInputs"></div>


            <!-- TOTAL -->
            <div class="popup-total">

                <span>
                    Total Weight
                </span>

                <strong id="popupTotal">
                    0.000 kg
                </strong>

            </div>


            <!-- SAVE -->
            <button class="save-btn" id="saveBtn">
                💾 Save
            </button>

        </div>

    </div>

<script type="module" src="Cone-stock.js?v=3"></script>

</body>
</html>
