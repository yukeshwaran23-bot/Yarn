<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cone Company</title>

    <link rel="stylesheet" href="Cone-company.css">
</head>




    <!-- TOP BAR -->

    <header class="topbar">

        <button
            class="back-btn"
            id="backBtn">
            ‹
        </button>


        <div class="title">

            <h1>Cone Company</h1>

            <p>Polyester Yarn</p>

        </div>


        <button
            class="add-btn"
            id="addBtn">
            +
        </button>

    </header>



    <!-- MAIN -->

    <main>

        <div class="page-heading">

            <h2>Cone Companies</h2>

            <p>
                View and manage cone companies
            </p>

        </div>


        <!-- COMPANY LIST -->

        <section
            id="companyList"
            class="company-list">
        </section>

    </main>



    <!-- ADD / EDIT POPUP -->

    <div
        class="popup-overlay"
        id="popupOverlay">

        <div class="popup">


            <div class="popup-header">

                <h2 id="popupTitle">
                    Add Cone Company
                </h2>

                <button
                    id="closePopup">
                    ×
                </button>

            </div>



            <label for="companyName">
                Company Name
            </label>


            <input
                type="text"
                id="companyName"
                placeholder="Ex: Radhika Cone"
                autocomplete="off"
            >


            <p
                id="errorMessage"
                class="error">
            </p>


            <div class="popup-buttons">

                <button
                    class="cancel-btn"
                    id="cancelBtn">
                    Cancel
                </button>


                <button
                    class="save-btn"
                    id="saveBtn">
                    Save
                </button>

            </div>

        </div>

    </div>



    <script type="module" src="./Cone-company.js"></script>
</body>

</html>
