<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yukeshwaran Yarn Storage Systeam</title>
    <link rel="stylesheet" href="Yarn-systeam.css">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <h1>Yukeshwaran</h1>
        <p>Yarn Storage Systeam</p>
    </div>
    
</header>

<main>
    <section class="hero">
        <div class="hero-content">
            <span class="small-title">ORGANIZE TODAY</span>
            <h2>Your Yarn<br>Inventory</h2>
            <p>Track polyester cones, jarigai companies and cone colours in one place.</p>
            <div class="tag">Simple • Organized • Ready</div>
        </div>

        <div class="hero-image">
            <img src="polyester-cone.png" alt="Polyester Yarn Cones">
        </div>
    </section>

    <section class="options">

        <button class="option-card cone-card" id="coneCompany">
            <div class="option-image">
                <img src="polyester-cone.png" alt="Polyester Cone">
            </div>
            <div class="option-info">
                <h3>Cone Company</h3>
                <p>View and manage polyester cone companies</p>
            </div>
            <span class="arrow">›</span>
        </button>

        <button class="option-card jarigai-card" id="jarigaiCompany">
            <div class="jarigai-icon">✨</div>
            <div class="option-info">
                <h3>Jarigai Company</h3>
                <p>View and manage jarigai companies</p>
            </div>
            <span class="arrow">›</span>
        </button>

        <button class="option-card colour-card" id="coneColours">
            <div class="colour-icon">
                <span class="red"></span><span class="blue"></span><span class="yellow"></span>
                <span class="green"></span><span class="pink"></span><span class="purple"></span>
            </div>
            <div class="option-info">
                <h3>Cone Colours</h3>
                <p>View and manage yarn colours</p>
            </div>
            <span class="arrow">›</span>
        </button>

    </section>

    <section class="bottom-yarn">
        <img src="yarn-banner.png" alt="Quality Polyester Yarn">
        <div class="bottom-text">
            <h3>Quality Yarn</h3>
            <p>Stronger Creations</p>
        </div>
    </section>
</main>



<script src="Yarn-systeam.js"></script>
</body>
</html>
