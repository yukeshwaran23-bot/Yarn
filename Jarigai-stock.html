<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jarigai Stock</title>

    <link
        rel="stylesheet"
        href="Jarigai-stock.css"
    >
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <button
            class="back-btn"
            id="backBtn"
            type="button"
        >
            ‹
        </button>


        <div class="top-info">

            <h1 id="companyName">
                Sri Lakshmi Jarigai
            </h1>

            <p>
                Jarigai Cones
            </p>

        </div>


        <button
            class="add-btn"
            id="addBtn"
            type="button"
        >
            +
        </button>

    </header>


    <!-- =========================
         TOTAL
    ========================== -->

    <section class="total-section">

        <div>
            <span>Total Bags</span>

            <strong id="totalBags">
                0
            </strong>
        </div>


        <div>
            <span>Buy</span>

            <strong
                class="buy-total"
                id="buyBags"
            >
                0
            </strong>
        </div>


        <div>
            <span>Return</span>

            <strong
                class="return-total"
                id="returnBags"
            >
                0
            </strong>
        </div>

    </section>


    <!-- =========================
         SEARCH
    ========================== -->

    <div class="search-box">

        <span>⌕</span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search transactions..."
        >

    </div>


    <!-- =========================
         TRANSACTIONS
    ========================== -->

    <main>

        <div id="transactionList"></div>


        <div
            id="emptyMessage"
            class="empty-message"
        >
            No transactions yet
        </div>

    </main>


    <!-- =========================
         POPUP
    ========================== -->

    <div
        class="popup-overlay"
        id="popupOverlay"
    >

        <div class="popup">

            <div class="popup-header">

                <h2 id="popupTitle">
                    Add Transaction
                </h2>


                <button
                    id="closePopup"
                    type="button"
                >
                    ×
                </button>

            </div>


            <!-- TYPE -->

            <label>
                Type
            </label>


            <div class="type-buttons">

                <button
                    id="buyBtn"
                    class="type-btn buy-btn active"
                    type="button"
                >
                    Buy
                </button>


                <button
                    id="returnBtn"
                    class="type-btn return-btn"
                    type="button"
                >
                    Return
                </button>

            </div>


            <!-- BAGS -->

            <label>
                Bags
            </label>


            <input
                type="number"
                id="bagsInput"
                min="1"
                placeholder="Enter number of bags"
            >


            <!-- COLOUR -->

            <label>
                Colour
            </label>


            <input
                type="text"
                id="colourInput"
                placeholder="Enter colour"
            >


            <!-- WEIGHT -->

            <label>
                Weight
                <span class="optional">
                    (Optional)
                </span>
            </label>


            <div class="weight-field">

                <input
                    type="number"
                    id="weightInput"
                    min="0"
                    step="0.001"
                    placeholder="e.g. 12.500"
                >

                <span>kg</span>

            </div>


            <!-- SAVE -->

            <button
                class="save-btn"
                id="saveBtn"
                type="button"
            >
                Save
            </button>

        </div>

    </div>


    <script src="Jarigai-stock.js"></script>

</body>

</html>
